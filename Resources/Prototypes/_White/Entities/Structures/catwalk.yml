# Old
- type: entity
  parent: Catwalk
  id: CatwalkOldSteel
  components:
  - type: Sprite
    sprite: _White/Structures/Catwalks/old.rsi
  - type: Icon
    sprite: _White/Structures/Catwalks/old.rsi
    state: steel_full
  - type: Transform
    anchored: true
  - type: IconSmooth
    key: catwalk
    base: steel_
  - type: Construction
    graph: CatwalkOldSteel
    node: CatwalkOldSteel

- type: entity
  parent: CatwalkOldSteel
  id: CatwalkOldWhite
  components:
  - type: Icon
    state: white_full
