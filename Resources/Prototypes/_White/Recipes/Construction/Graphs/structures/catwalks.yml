# Old
- type: constructionGraph
  id: CatwalkOldSteel
  start: start
  graph:
  - node: start
    edges:
    - to: CatwalkOldSteel
      completed:
      - !type:SnapToGrid
        southRotation: true
      steps:
      - material: MetalRod
        amount: 2
  - node: CatwalkOldSteel
    entity: CatwalkOldSteel
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: PartRodMetal1
        amount: 2
      - !type:DeleteEntity {}
      steps:
      - tool: Cutting

